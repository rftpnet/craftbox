name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional release tag
        required: false
        type: string
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      date: ${{ steps.meta.outputs.date }}
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(date -u +%Y%m%d)"
          fi
          date="${tag#v}"
          case "$date" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "tag must look like vYYYYMMDD" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Write base manifest
        run: |
          set -eu
          : > bases.txt
          for java in 8 17 21 25; do
            image="docker.io/library/eclipse-temurin:${java}-jre-alpine"
            digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')"
            echo "java${java} ${image}@${digest}" >> bases.txt
          done
          cat bases.txt

      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p previous
          if ! gh release download "$latest" --pattern bases.txt --dir previous >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if cmp -s bases.txt previous/bases.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bases
          path: bases.txt

  image:
    needs: base
    if: needs.base.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        java: ["8", "17", "21", "25"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: JAVA_VERSION=${{ matrix.java }}
          tags: |
            ${{ env.IMAGE }}:java${{ matrix.java }}
            ${{ env.IMAGE }}:java${{ matrix.java }}-${{ needs.base.outputs.date }}

      - name: Save image archive
        run: |
          set -eu
          ref="${IMAGE}:java${{ matrix.java }}-${{ needs.base.outputs.date }}"
          file="craftbox-java${{ matrix.java }}-${{ needs.base.outputs.date }}.tar.gz"
          docker pull "$ref"
          docker save "$ref" | gzip -9 > "$file"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-java${{ matrix.java }}
          path: craftbox-java${{ matrix.java }}-${{ needs.base.outputs.date }}.tar.gz

  release:
    needs: [base, image]
    if: needs.base.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bases

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="${{ needs.base.outputs.tag }}"
          date="${{ needs.base.outputs.date }}"
          cat > notes.md <<EOF
          Image tags:

          - ${IMAGE}:java8
          - ${IMAGE}:java17
          - ${IMAGE}:java21
          - ${IMAGE}:java25
          - ${IMAGE}:java8-${date}
          - ${IMAGE}:java17-${date}
          - ${IMAGE}:java21-${date}
          - ${IMAGE}:java25-${date}
          EOF
          gh release create "$tag" bases.txt ./*.tar.gz --title "$tag" --notes-file notes.md
